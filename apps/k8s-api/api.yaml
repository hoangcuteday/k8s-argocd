apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api-rollout
  namespace: default
  labels:
    app: api
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 2

  selector:
    matchLabels:
      app: api

  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: hoangcute19/w9-api:v2
          ports:
            - containerPort: 8080
          env:
            - name: ERROR_RATE
              value: '0'
            - name: VERSION
              value: 'v2'
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

  strategy:
    canary:
      steps:
        - setWeight: 25
        - analysis:
            templates:
              - templateName: api-5xx-analysis

        - setWeight: 50
        - analysis:
            templates:
              - templateName: api-5xx-analysis

        - setWeight: 100

---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: default
  labels:
    app: api
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 8080
